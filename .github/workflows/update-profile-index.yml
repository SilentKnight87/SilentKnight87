name: Update profile index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  update-profile-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate README
        env:
          # Optional but recommended: add a classic/fine-grained PAT secret with
          # read access to the private repos you intentionally list. Without it,
          # the manifest's fallback private flags are used.
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_readme.py

      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md profile-index.json; then
            echo "Profile index already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-index.json
          git commit -m "Update profile repo index"
          git push
